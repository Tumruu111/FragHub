<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your pre-order — VERITAS PARFUMS</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #080808;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        color: #ede9e2;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      .logo {
        text-align: center;
        font-size: 22px;
        letter-spacing: 0.4em;
        color: #c9a84c;
        margin-bottom: 8px;
      }
      .gold-line {
        width: 40px;
        height: 1px;
        background: #c9a84c;
        margin: 0 auto 32px;
      }
      .heading {
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.35em;
        color: #c9a84c;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      h1 {
        text-align: center;
        font-size: 28px;
        font-weight: 300;
        margin-bottom: 20px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: #a39e96;
        text-align: center;
      }
      .amount {
        font-size: 32px;
        color: #c9a84c;
        text-align: center;
        margin: 28px 0 8px;
      }
      .btn-wrap {
        text-align: center;
        margin: 32px 0;
      }
      .btn {
        display: inline-block;
        padding: 14px 36px;
        background: #c9a84c;
        color: #0a0a0a !important;
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 0.3em;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 32px;
      }
      td {
        padding: 10px 0;
        font-size: 13px;
        border-top: 1px solid #1f1f1f;
        color: #ede9e2;
      }
      td.price {
        text-align: right;
        color: #a39e96;
      }
      .total td {
        color: #c9a84c;
      }
      .delivery {
        margin-top: 24px;
        font-size: 12px;
        color: #6b6760;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">VERITAS PARFUMS</div>
      <div class="gold-line"></div>

      <p class="heading">{{heading}}</p>
      <h1>Pre-order #{{orderId}}</h1>
      <p>Hi {{name}},<br />{{body}}</p>

      {{#if amount}}
      <p class="amount">{{amount}}</p>
      {{/if}} {{#if actionUrl}}
      <div class="btn-wrap">
        <a class="btn" href="{{actionUrl}}">{{actionLabel}}</a>
      </div>
      {{/if}}

      <table>
        {{#each items}}
        <tr>
          <td>{{title}}</td>
          <td class="price">{{price}}</td>
        </tr>
        {{/each}}
        <tr class="total">
          <td>Total</td>
          <td class="price">{{total}}</td>
        </tr>
      </table>

      <p class="delivery">
        Delivering to {{address}} · {{phone}}{{#if note}}<br />{{note}}{{/if}}
      </p>
    </div>
  </body>
</html>
